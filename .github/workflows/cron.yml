# Scheduled workers, run from GitHub rather than Vercel.
#
# WHY NOT VERCEL CRON: the Hobby plan allows 2 cron jobs per project. The
# routes were always callable from outside with a Bearer token, so this needs
# no code change: it is the same endpoint Vercel Cron would have hit. Free, and
# it removes the hosting plan from the critical path.
#
# TO MOVE BACK TO VERCEL CRON on a Pro plan: restore the `crons` block in
# apps/app/vercel.json and delete this file. Do not run both, or every
# escalation gets two delivery attempts.
#
# Two repository secrets are required (Settings > Secrets and variables >
# Actions): CRON_SECRET, the same value set in Vercel, and APP_URL, e.g.
# https://app.txid.support

name: Scheduled workers

# ONCE A DAY, both jobs, one run. It was every 10 minutes for the retry worker,
# which is the cadence that job actually wants: its backoff is 1m/5m/30m/2h/6h,
# so on a daily tick five attempts take five days rather than nine hours. That
# is a deliberate trade while there is no live escalation traffic to drain, and
# `workflow_dispatch` covers the case where something is genuinely stuck. Put
# the frequent schedule back the moment redelivery latency starts mattering.
on:
  schedule:
    - cron: "0 3 * * *"
  # So a failed delivery can be drained by hand without waiting a day.
  workflow_dispatch:

# One at a time: a slow run must never overlap the next tick and double-send.
concurrency:
  group: scheduled-workers
  cancel-in-progress: false

jobs:
  escalation-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Redeliver failed escalations
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/escalation-retry")
          cat /tmp/out.json
          echo
          # Fail loudly on a non-200 so a broken secret shows up as a red run
          # rather than as escalations quietly never being retried.
          if [ "$code" != "200" ]; then
            echo "::error::escalation-retry returned HTTP $code: $(cat /tmp/out.json)"
            exit 1
          fi

  docs-resync:
    runs-on: ubuntu-latest
    steps:
      - name: Re-check documentation for changes
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/docs-resync")
          cat /tmp/out.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::docs-resync returned HTTP $code: $(cat /tmp/out.json)"
            exit 1
          fi
