# Unit tests + the embed smoke, on every push and PR.
#
# Exists because 38 commits shipped in one day with a human as the only QA:
# the spotlight broke twice through paths reading-the-code missed, and both
# were caught only when a browser actually ran it. The smoke IS that browser.
name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: package.json's packageManager field
      # already pins pnpm, and specifying both makes the action refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter @txid/app exec vitest run
      # The packages were never covered. abort.test.ts guarded the Move abort
      # decoder and had not run once in CI; decoder.test.ts guards the revert
      # replay. Both are core and both are pure, so there is no reason they
      # were not here.
      - name: Package unit tests
        run: |
          pnpm --filter @txid/blockchain exec vitest run
          pnpm --filter @txid/aptos exec vitest run
      - name: Install Chromium
        run: pnpm --filter @txid/app exec playwright install --with-deps chromium
      - name: Embed smoke (spotlight choreography)
        run: pnpm --filter @txid/app run smoke:embed
