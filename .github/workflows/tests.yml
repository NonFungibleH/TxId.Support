# Unit tests + the embed smoke, on every push and PR.
#
# Exists because 38 commits shipped in one day with a human as the only QA:
# the spotlight broke twice through paths reading-the-code missed, and both
# were caught only when a browser actually ran it. The smoke IS that browser.
name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: package.json's packageManager field
      # already pins pnpm, and specifying both makes the action refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # EVERY package's tests, derived from the workspace rather than listed.
      #
      # This step used to hand-list the packages, and that list was forgotten
      # THREE times: the packages were not covered at all; then Sui, Solana and
      # LayerZero were added and left out, 75 tests that never ran; then
      # @txid/ai and @txid/near, another 92, including the drift guard for the
      # generated error table, so the published pages could have diverged from
      # the decoders with CI green.
      #
      # A comment saying "every package with tests belongs on this list" did not
      # stop it happening twice more, because the list is a SECOND registry and
      # a second registry always drifts. `turbo run test` reads the workspace,
      # and apps/app/lib/__tests__/test-scripts-registered.test.ts fails if a
      # package holds tests without a `test` script. Together those close the
      # loop: nothing can have tests that CI does not run.
      - name: All unit tests
        run: pnpm test

      # The two build-time gates that need no runtime keys. Until 2026-09-03
      # this check ran neither, so a commit could be green here and fail the
      # Vercel Preview: next build lints test files too, and an `as any` in a
      # test took the build down. Static page generation needs Clerk keys and
      # stays Vercel's job; a full `next build` here would fail on env alone.
      #
      # Still earning their keep: on 2026-09-08 a variable named `module` in a
      # test under apps/web passed every unit test and failed the web deploy,
      # because @next/next/no-assign-module-variable is an ERROR not a warning.
      - name: Lint (what next build runs first)
        run: pnpm --filter @txid/app exec next lint
      - name: Typecheck
        run: pnpm --filter @txid/app exec tsc --noEmit

      - name: Install Chromium
        run: pnpm --filter @txid/app exec playwright install --with-deps chromium
      - name: Embed smoke (spotlight choreography)
        run: pnpm --filter @txid/app run smoke:embed
